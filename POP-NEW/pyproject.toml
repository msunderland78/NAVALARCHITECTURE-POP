[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pop"
version = "1.0.0"
description = "Propeller Optimization Program for the Web"
requires-python = ">=3.12"
# numpy is the only runtime dependency. It is used to vectorise the
# Wageningen polynomial and the optimizer's grid search, which would
# otherwise dominate request latency. The HTTP server, OLE Compound File
# reader, and the rest of the calculation core remain stdlib-only.
dependencies = [
    "numpy~=2.2"
]

[project.urls]
homepage = "https://github.com/msunderland78/NAVALARCHITECTURE-POP"

# The project layout is not an importable package. pop_core lives under
# app/backend/ and is reached via PYTHONPATH. Declare no modules so
# `pip install .` only installs the declared dependencies.
[tool.setuptools]
py-modules = []
packages = []
